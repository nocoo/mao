<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="山河诗卷：毛主席诗词阅读与鉴赏。">
<title>毛泽东诗词鉴赏 · 山河诗卷</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-star" viewBox="0 0 100 93"><polygon points="50,0 61.2,34.5 97.6,34.5 68.2,55.9 79.4,90.5 50,69.1 20.6,90.5 31.8,55.9 2.4,34.5 38.8,34.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4.2v14H6zM13.8 5H18v14h-4.2z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2.2v12H6zM19 6v12l-9-6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M15.8 6H18v12h-2.2zM5 6l9 6-9 6z"/></symbol>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .07  0 0 0 0 .06  0 0 0 0 .06  .9 0 0 0 -.36"/>
  </filter>
</svg>

<div class="app" id="app" data-index="1">

  <aside class="rail" aria-label="站点">
    <svg class="rail-star" aria-hidden="true"><use href="#i-star"/></svg>
    <div class="rail-title">毛泽东诗词</div>
    <div class="rail-line"></div>
    <div class="rail-sub">POEMS OF MAO ZEDONG · 鉴赏</div>
    <div class="rail-tools">
      <button class="tool" id="tIndex" aria-pressed="true" title="目录 (L)" aria-label="显示或收起目录">目</button>
      <button class="tool" id="tMatrix" title="总目矩阵 (M)" aria-label="打开总目矩阵">总</button>
      <button class="tool" id="tTheme" title="昼 / 夜 (T)" aria-label="切换昼夜配色">夜</button>
      <button class="tool" id="tVert" title="切换回横排" aria-label="切换回横排" hidden>横</button>
    </div>
    <div class="rail-yr">2077</div>
  </aside>

  <nav class="index" id="index" aria-label="诗词目录">
    <div class="ix-head">
      <h2>目录</h2>
      <div class="ix-cnt"><span id="ixCnt">100</span><small>篇资料</small></div>
      <div class="ix-en"><span>INDEX</span><i></i><span>依原索引编次</span></div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" placeholder="检索 词牌 · 题 · 年份" autocomplete="off" spellcheck="false" aria-label="检索诗词">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
    <div class="ix-foot">
      <button class="mx-btn" id="mxBtn">
        <span class="dots"></span>
        <span><b>总目矩阵</b><small id="mxSub">全卷诗词 · 一览</small></span>
        <span class="arr">↗</span>
      </button>
    </div>
  </nav>

  <main class="stage" id="stage">
    <div class="scroll" id="scroll">
      <section class="hero" id="hero">
        <div class="beacon" id="beacon" aria-hidden="true"></div>
        <div class="bignum" id="bignum" aria-hidden="true"></div>
        <canvas class="fx" id="fx" aria-hidden="true"></canvas>

        <div class="sheet">
          <header class="hud">
            <span class="no"><b id="hudNo">—</b><span>/ 100 篇</span></span>
            <span class="rule"></span>
            <span class="dim" id="hudForm"></span>
            <span class="rule"></span>
            <span class="dim x" id="hudPlace"></span>
          </header>

          <div class="title" id="title">
            <span class="cp" id="cp"></span>
            <h1 id="tt"></h1>
            <div class="t-side"><span class="au" id="author">毛泽东</span><span class="dt" id="dt"></span></div>
          </div>

          <div class="poem-wrap" id="poemWrap" tabindex="0" role="region" aria-label="诗词正文，可滚动阅读"><div class="poem" id="poem" lang="zh-Hans"></div></div>
          <div class="vertical-hint" id="verticalHint" hidden></div>

          <div class="acts">
            <button class="act pri" id="aPlay"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg><span id="aPlayT">朗读全篇</span></button>
            <button class="act" id="aNotes" aria-pressed="true">注释 <b id="aNotesN">0</b></button>
            <button class="act" id="aRhyme" disabled title="资料未提供逐篇韵脚">韵脚</button>
            <button class="act" id="aVert" aria-pressed="false">竖排</button>
            <button class="act go" id="aStudy">鉴赏 ↓</button>
          </div>
        </div>

        <aside class="plate-col" aria-label="配图">
          <div class="pl-top"><span>图版 PLATE</span><b id="plNo">000</b><i></i><span>3 : 4</span></div>
          <div class="pl-box">
            <figure class="plate" id="plate" aria-label="示意版画">
              <div class="pl-clip">
                <div class="pl-art" id="plArt"></div>
                <div class="pl-half"></div>
                <div class="pl-sheen"></div>
                <div class="pl-slogan" id="plSlogan"></div>
                <div class="pl-tag" id="plTag">配图位</div>
              </div>
              <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
            </figure>
          </div>
          <div class="pl-foot"><span class="sw" aria-hidden="true"><span></span><span></span><span></span></span><span id="plCap">示意版画 · 随机选用</span><i></i></div>
        </aside>

        <div class="ticker" aria-hidden="true"><div class="tk" id="tk"></div></div>
      </section>

      <section class="study" id="study" aria-label="鉴赏"></section>
    </div>
    <svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
    <div class="curtain" id="curtain" aria-hidden="true"><div class="cur-in"><svg><use href="#i-star"/></svg><span id="curNo">019</span></div></div>
  </main>

  <footer class="player" id="player" aria-label="朗读播放器">
    <button class="pp" id="pp" aria-label="播放 / 暂停 (空格)">
      <svg class="ring" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="33"/><circle class="pg" id="ring" cx="35" cy="35" r="33"/></svg>
      <svg class="ico i-play" aria-hidden="true"><use href="#i-play"/></svg>
      <svg class="ico i-pause" aria-hidden="true"><use href="#i-pause"/></svg>
    </button>
    <div class="pl-nav">
      <button id="prevL" aria-label="前一篇"><svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg></button>
      <button id="nextL" aria-label="后一篇"><svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></button>
    </div>
    <div class="now"><div class="k"><span id="pMode">人声朗读</span><span>·</span><span id="pIdx">00 / 00</span></div><div class="l" id="pLine"></div></div>
    <div class="wave"><div class="bars" id="bars" aria-hidden="true"></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="录音播放进度"></div>
    <div class="ctl"><button id="rate" title="播放速度">1.0×</button></div>
    <audio id="audio" preload="metadata"></audio>
  </footer>
</div>

<div class="pop" id="pop" role="dialog" aria-label="注释" aria-hidden="true" data-pos="below" inert>
  <div class="pop-h"><span class="pop-n"><small>注</small><span id="popN">01</span></span><b class="pop-k" id="popK"></b><button class="pop-x" id="popX" aria-label="关闭注释">×</button></div>
  <p class="pop-t" id="popT"></p>
  <div class="pop-f"><button id="popPrev">‹ 上一条</button><span id="popI">1 / 1</span><button id="popNext">下一条 ›</button></div>
</div>

<div class="matrix" id="matrix" role="dialog" aria-modal="true" aria-label="总目矩阵" aria-hidden="true" inert>
  <div class="mx-h">
    <h2>总目矩阵</h2>
    <span class="s" id="mxS">100 篇资料</span>
    <i></i>
    <div class="lg"><span class="a">有录音</span><span class="b">录音待补</span></div>
    <button class="mx-x" id="mxX" aria-label="关闭">×</button>
  </div>
  <div class="cells" id="cells"></div>
</div>

<div class="toast" id="toast" role="status"></div>
<noscript>启用 JavaScript 后阅读诗词，或打开 <a href="data/诗词/index.md">诗词索引</a>。</noscript>
</body>
</html>
