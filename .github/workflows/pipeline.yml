name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Mao Worker
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      auto-rollback: true
      package-manager: pnpm
      runtime-version: "11.28.5"
      node-version: "26.12.1"
      install-policy: blocked
      sparse-checkout: |
        /*
        !/design/
      artifact-name: mao-static-site
      artifact-path: dist
      environment: production
      concurrency-group: mao-production
      timeout-minutes: 20
      verify-command: pnpm run verify:production
      verify-retries: 12
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
