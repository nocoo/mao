name: Release
run-name: Deploy CI ${{ github.event.workflow_run.id || inputs.source-run-id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful main CI run ID to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Mao Worker
    # Automatic deploys remain disabled until production credentials are configured.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_WORKER_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@1ea10ecab22b72512399485391603fe03a161016  # v2026.12
    with:
      expected-workflow-path: .github/workflows/ci.yml
      expected-workflow-name: CI
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      source-sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      package-manager: pnpm
      runtime-version: "11.28.5"
      node-version: "26.12.1"
      install-policy: blocked
      build-command: pnpm run build && pnpm run deploy:check
      environment: production
      concurrency-group: mao-production
      timeout-minutes: 20
      verify-command: pnpm run verify:production
      verify-retries: 12
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
